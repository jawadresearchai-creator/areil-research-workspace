name: Analyze GSE255759 with PyDESeq2 0.5.4

on:
  push:
    branches:
      - fetch-gse255759
    paths:
      - '.github/workflows/analyze-gse255759-pydeseq2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact analysis environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'pydeseq2==0.5.4' 'pandas>=2.1,<3' 'numpy<3' 'scipy<2'
          mkdir -p out
          python - <<'PY'
          import sys, pydeseq2, pandas, numpy, scipy
          with open('out/environment.txt','w') as f:
              f.write(f'python={sys.version}\n')
              f.write(f'pydeseq2={pydeseq2.__version__}\n')
              f.write(f'pandas={pandas.__version__}\n')
              f.write(f'numpy={numpy.__version__}\n')
              f.write(f'scipy={scipy.__version__}\n')
          PY
          python -m pip freeze > out/pip_freeze.txt

      - name: Download authoritative GEO source files
        shell: bash
        run: |
          set -euo pipefail
          ROOT_URL='https://ftp.ncbi.nlm.nih.gov/geo/series/GSE255nnn/GSE255759/suppl/GSE255759_counts_roots.csv.gz'
          SOFT_URL='https://ftp.ncbi.nlm.nih.gov/geo/series/GSE255nnn/GSE255759/soft/GSE255759_family.soft.gz'
          curl -fL --retry 5 --retry-delay 3 "$ROOT_URL" -o out/GSE255759_counts_roots.csv.gz
          curl -fL --retry 5 --retry-delay 3 "$SOFT_URL" -o out/GSE255759_family.soft.gz
          gzip -dc out/GSE255759_counts_roots.csv.gz > out/GSE255759_counts_roots.csv
          gzip -dc out/GSE255759_family.soft.gz > out/GSE255759_family.soft
          (cd out && sha256sum GSE255759_counts_roots.csv.gz GSE255759_family.soft.gz > SHA256SUMS.txt)

      - name: Build frozen sample manifest and validate matrix
        shell: python
        run: |
          import csv, json, pathlib, re, hashlib
          import pandas as pd
          import numpy as np
          from datetime import datetime, timezone

          out = pathlib.Path('out')
          roots = out/'GSE255759_counts_roots.csv'
          soft = out/'GSE255759_family.soft'

          raw = pd.read_csv(roots, sep=';', header=None, dtype=str)
          numeric_ids = raw.iloc[0, 1:].tolist()
          sample_names = raw.iloc[1, 1:].tolist()
          genes = raw.iloc[2:, 0].astype(str).tolist()
          vals = raw.iloc[2:, 1:]
          numeric = vals.apply(pd.to_numeric, errors='raise')
          integer_like = bool(np.all(np.equal(numeric.to_numpy(), np.floor(numeric.to_numpy()))))
          nonnegative = bool((numeric.to_numpy() >= 0).all())
          duplicated_genes = int(pd.Index(genes).duplicated().sum())

          counts = numeric.copy()
          counts.index = genes
          counts.columns = sample_names
          counts = counts.astype(int)
          counts.to_csv(out/'GSE255759_roots_counts_clean.csv')

          records=[]; cur=None
          for line in soft.read_text(encoding='utf-8', errors='replace').splitlines():
              if line.startswith('^SAMPLE = '):
                  if cur: records.append(cur)
                  cur={'gsm': line.split('=',1)[1].strip(), 'characteristics': []}
              elif cur is not None and line.startswith('!Sample_title = '):
                  cur['title']=line.split('=',1)[1].strip()
              elif cur is not None and line.startswith('!Sample_geo_accession = '):
                  cur['gsm']=line.split('=',1)[1].strip()
              elif cur is not None and line.startswith('!Sample_characteristics_ch1 = '):
                  cur['characteristics'].append(line.split('=',1)[1].strip())
          if cur: records.append(cur)

          by_title={r.get('title'):r for r in records if r.get('title')}
          rows=[]
          for lib_id,title in zip(numeric_ids,sample_names):
              r=by_title.get(title,{})
              chars={}
              for x in r.get('characteristics',[]):
                  if ':' in x:
                      k,v=x.split(':',1); chars[k.strip().lower()]=v.strip()
              m=re.match(r'Roots_(ML|PL)(2x|4x)(Ctrl|WD)_(\d+)$', title)
              if not m:
                  raise SystemExit(f'Unexpected root sample title: {title}')
              scion_code, ploidy, trt_code, rep=m.groups()
              combo=f'{scion_code}{ploidy}'
              treatment='Control' if trt_code=='Ctrl' else 'Water deficit'
              rows.append({
                  'matrix_library_id':lib_id,
                  'sample_title':title,
                  'gsm':r.get('gsm',''),
                  'tissue':chars.get('tissue',''),
                  'scion':chars.get('scion',''),
                  'rootstock':chars.get('rootstock',''),
                  'combination':combo,
                  'treatment':treatment,
                  'replicate':int(rep),
                  'included':True,
                  'count_matrix_column':title
              })
          manifest=pd.DataFrame(rows)
          manifest.to_csv(out/'GSE255759_root_sample_manifest.csv', index=False)

          lib_sums=counts.sum(axis=0).rename('library_sum').reset_index().rename(columns={'index':'sample_title'})
          lib_sums.to_csv(out/'GSE255759_library_sums.csv', index=False)

          group_counts={
              f'{combo}|{treatment}': int(n)
              for (combo,treatment), n in manifest.groupby(['combination','treatment']).size().items()
          }
          qc={
              'accession':'GSE255759',
              'retrieved_utc':datetime.now(timezone.utc).isoformat(),
              'n_root_samples':int(counts.shape[1]),
              'n_genes':int(counts.shape[0]),
              'all_values_integer_like':integer_like,
              'all_values_nonnegative':nonnegative,
              'duplicated_gene_ids':duplicated_genes,
              'all_sample_titles_mapped_to_SOFT':bool(manifest['gsm'].ne('').all()),
              'group_counts':group_counts,
              'target_gene_rows_present':{
                  'Ciclev10012384m.g': bool('Ciclev10012384m.g' in counts.index),
                  'Ciclev10029003m.g': bool('Ciclev10029003m.g' in counts.index)
              },
              'matrix_interpretation':'Integer, non-negative gene-by-sample matrix generated according to GEO metadata with HTSeq-count. GEO text also labels files as raw counts (RPKM), which is internally inconsistent; analysis treats the deposited integer matrix as counts and records this ambiguity.'
          }
          (out/'matrix_validation.json').write_text(json.dumps(qc, indent=2))
          if not (integer_like and nonnegative and duplicated_genes==0 and manifest['gsm'].ne('').all()):
              raise SystemExit('Matrix/sample validation failed')

      - name: Run four prespecified PyDESeq2 contrasts
        shell: python
        run: |
          import json, pathlib
          import pandas as pd
          import pydeseq2
          from pydeseq2.dds import DeseqDataSet
          from pydeseq2.ds import DeseqStats
          from pydeseq2.default_inference import DefaultInference

          out=pathlib.Path('out')
          counts_all=pd.read_csv(out/'GSE255759_roots_counts_clean.csv', index_col=0).T
          manifest=pd.read_csv(out/'GSE255759_root_sample_manifest.csv').set_index('sample_title')
          targets={'PIP1':'Ciclev10012384m.g','PIP2':'Ciclev10029003m.g'}
          expected={
            ('ML2x','PIP1'):{'log2FoldChange':-0.435},
            ('ML4x','PIP1'):{'log2FoldChange':0.001},
            ('PL2x','PIP1'):{'log2FoldChange':-0.101},
            ('PL4x','PIP1'):{'log2FoldChange':-0.015},
            ('ML2x','PIP2'):{'log2FoldChange':-1.946,'padj':1.36e-5},
            ('ML4x','PIP2'):{'log2FoldChange':-0.667,'padj':0.0944},
            ('PL2x','PIP2'):{'log2FoldChange':-1.277,'padj':0.00312},
            ('PL4x','PIP2'):{'log2FoldChange':-0.842,'padj':0.194},
          }
          target_rows=[]
          summary=[]
          inference=DefaultInference(n_cpus=2)

          for combo in ['ML2x','ML4x','PL2x','PL4x']:
              sm=manifest[manifest['combination']==combo].copy()
              sample_order=sm.index.tolist()
              counts=counts_all.loc[sample_order].copy()
              counts=counts.loc[:, counts.sum(axis=0)>0].astype(int)
              meta=pd.DataFrame(index=sample_order)
              meta['condition']=pd.Categorical(
                  ['control' if t=='Control' else 'water_deficit' for t in sm['treatment']],
                  categories=['control','water_deficit']
              )
              dds=DeseqDataSet(
                  counts=counts,
                  metadata=meta,
                  design='~condition',
                  refit_cooks=True,
                  inference=inference,
                  quiet=True
              )
              dds.deseq2()
              ds=DeseqStats(
                  dds,
                  contrast=['condition','water_deficit','control'],
                  alpha=0.05,
                  cooks_filter=True,
                  independent_filter=True,
                  inference=inference,
                  quiet=True
              )
              ds.summary()
              res=ds.results_df.copy()
              res.index.name='gene_id'
              res.to_csv(out/f'DE_{combo}_WD_vs_Control_pydeseq2_0.5.4.csv')
              nctrl=int((meta['condition']=='control').sum())
              nwd=int((meta['condition']=='water_deficit').sum())
              summary.append({'combination':combo,'n_control':nctrl,'n_water_deficit':nwd,'genes_tested':int(res.shape[0])})
              for label,gid in targets.items():
                  r=res.loc[gid]
                  er=expected[(combo,label)]
                  row={
                      'combination':combo,'gene_label':label,'gene_id':gid,
                      'n_control':nctrl,'n_water_deficit':nwd,
                      'baseMean':float(r['baseMean']),
                      'log2FoldChange':float(r['log2FoldChange']),
                      'lfcSE':float(r['lfcSE']),
                      'stat':float(r['stat']),
                      'pvalue':float(r['pvalue']) if pd.notna(r['pvalue']) else None,
                      'padj':float(r['padj']) if pd.notna(r['padj']) else None,
                      'manuscript_log2FC':er.get('log2FoldChange'),
                      'delta_log2FC':float(r['log2FoldChange'])-er.get('log2FoldChange'),
                      'manuscript_padj':er.get('padj'),
                      'delta_padj':(float(r['padj'])-er['padj']) if er.get('padj') is not None and pd.notna(r['padj']) else None,
                      'pydeseq2_version':pydeseq2.__version__,
                      'independent_filter':True,
                      'cooks_filter':True,
                  }
                  target_rows.append(row)

          panel=pd.DataFrame(target_rows)
          panel.to_csv(out/'GSE255759_PIP_panel_pydeseq2_0.5.4.csv',index=False)
          pd.DataFrame(summary).to_csv(out/'contrast_summary.csv',index=False)
          (out/'analysis_summary.json').write_text(json.dumps({'pydeseq2_version':pydeseq2.__version__,'contrasts':summary,'target_panel_records':target_rows},indent=2,allow_nan=False))

      - name: Build manuscript reconciliation and checksums
        shell: python
        run: |
          import pandas as pd, pathlib, hashlib
          out=pathlib.Path('out')
          p=pd.read_csv(out/'GSE255759_PIP_panel_pydeseq2_0.5.4.csv')
          rows=[]
          for _,r in p.iterrows():
              rows.append({
                  'claim_id':f"MOL-{r['combination']}-{r['gene_label']}-LFC",
                  'combination':r['combination'],'gene':r['gene_label'],'metric':'log2FoldChange',
                  'manuscript_value':r['manuscript_log2FC'],'recomputed_value':r['log2FoldChange'],
                  'absolute_difference':abs(r['delta_log2FC']),
                  'tolerance':0.005,
                  'status':'PASS' if abs(r['delta_log2FC']) <= 0.005 else 'FAIL'
              })
              if pd.notna(r['manuscript_padj']):
                  diff=abs(r['delta_padj'])
                  tol=max(5e-6, abs(r['manuscript_padj'])*0.03)
                  rows.append({
                      'claim_id':f"MOL-{r['combination']}-{r['gene_label']}-FDR",
                      'combination':r['combination'],'gene':r['gene_label'],'metric':'padj',
                      'manuscript_value':r['manuscript_padj'],'recomputed_value':r['padj'],
                      'absolute_difference':diff,'tolerance':tol,
                      'status':'PASS' if diff <= tol else 'FAIL'
                  })
          rec=pd.DataFrame(rows)
          rec.to_csv(out/'manuscript_molecular_reconciliation.csv',index=False)
          with open(out/'ALL_SHA256SUMS.txt','w') as f:
              for path in sorted(out.iterdir()):
                  if path.is_file() and path.name!='ALL_SHA256SUMS.txt':
                      h=hashlib.sha256(path.read_bytes()).hexdigest()
                      f.write(f'{h}  {path.name}\n')
          print(rec.to_string(index=False))
          print('\n--- target panel ---')
          print(p.to_string(index=False))

      - name: Upload full reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSE255759_PyDESeq2_0.5.4_reanalysis
          path: out/
          if-no-files-found: error
          retention-days: 30
