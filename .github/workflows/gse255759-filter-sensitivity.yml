name: GSE255759 filter sensitivity

on:
  push:
    branches: [fetch-gse255759]
    paths: ['.github/workflows/gse255759-filter-sensitivity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install 'pydeseq2==0.5.4' 'pandas>=2.1,<3' 'numpy<3' 'scipy<2'
      - name: Download matrix
        shell: bash
        run: |
          curl -fL 'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE255nnn/GSE255759/suppl/GSE255759_counts_roots.csv.gz' -o roots.csv.gz
          gzip -dc roots.csv.gz > roots.csv
      - name: Run candidate filters
        shell: python
        run: |
          import pandas as pd, numpy as np, json
          from pydeseq2.dds import DeseqDataSet
          from pydeseq2.ds import DeseqStats
          from pydeseq2.default_inference import DefaultInference
          raw=pd.read_csv('roots.csv',sep=';',header=None,dtype=str)
          names=raw.iloc[1,1:].tolist()
          x=raw.iloc[2:,1:].apply(pd.to_numeric).astype(int)
          x.index=raw.iloc[2:,0].tolist(); x.columns=names
          groups={
            'ML4x':[c for c in names if c.startswith('Roots_ML4x')],
            'PL4x':[c for c in names if c.startswith('Roots_PL4x')],
          }
          filters={
            'all_zero_only':lambda z:z.sum(axis=1)>0,
            'total_ge_5':lambda z:z.sum(axis=1)>=5,
            'total_ge_6':lambda z:z.sum(axis=1)>=6,
            'total_ge_10':lambda z:z.sum(axis=1)>=10,
          }
          inf=DefaultInference(n_cpus=2)
          rows=[]
          for combo,samps in groups.items():
            meta=pd.DataFrame(index=samps)
            meta['condition']=pd.Categorical(['control' if 'Ctrl' in s else 'water_deficit' for s in samps],categories=['control','water_deficit'])
            z=x[samps].T
            for fname,fn in filters.items():
              keep=fn(z.T)
              c=z.loc[:,keep].copy()
              dds=DeseqDataSet(counts=c,metadata=meta,design='~condition',refit_cooks=True,inference=inf,quiet=True)
              dds.deseq2()
              ds=DeseqStats(dds,contrast=['condition','water_deficit','control'],alpha=0.05,cooks_filter=True,independent_filter=True,inference=inf,quiet=True)
              ds.summary(); r=ds.results_df.loc['Ciclev10029003m.g']
              rows.append({'combo':combo,'filter':fname,'n_genes':int(c.shape[1]),'lfc':float(r.log2FoldChange),'pvalue':float(r.pvalue),'padj':float(r.padj)})
          o=pd.DataFrame(rows); o.to_csv('filter_sensitivity.csv',index=False); print(o.to_string(index=False))
      - uses: actions/upload-artifact@v4
        with:
          name: GSE255759_filter_sensitivity
          path: filter_sensitivity.csv
          retention-days: 30
