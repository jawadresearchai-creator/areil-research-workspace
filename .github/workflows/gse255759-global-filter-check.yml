name: GSE255759 global filter check

on:
  push:
    branches: [fetch-gse255759]
    paths: ['.github/workflows/gse255759-global-filter-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install 'pydeseq2==0.5.4' 'pandas>=2.1,<3' 'numpy<3' 'scipy<2'
      - name: Download matrix
        shell: bash
        run: |
          curl -fL 'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE255nnn/GSE255759/suppl/GSE255759_counts_roots.csv.gz' -o roots.csv.gz
          gzip -dc roots.csv.gz > roots.csv
      - name: Reproduce published global filtering and four contrasts
        shell: python
        run: |
          import pandas as pd, numpy as np
          from pydeseq2.dds import DeseqDataSet
          from pydeseq2.ds import DeseqStats
          from pydeseq2.default_inference import DefaultInference
          raw=pd.read_csv('roots.csv',sep=';',header=None,dtype=str)
          names=raw.iloc[1,1:].tolist()
          x=raw.iloc[2:,1:].apply(pd.to_numeric).astype(int)
          x.index=raw.iloc[2:,0].tolist(); x.columns=names
          keep_global=x.sum(axis=1)>=10
          xf=x.loc[keep_global].copy()
          assert xf.shape[0]==22367, xf.shape
          groups={g:[c for c in names if c.startswith('Roots_'+g)] for g in ['ML2x','ML4x','PL2x','PL4x']}
          targets=['Ciclev10012384m.g','Ciclev10029003m.g']
          inf=DefaultInference(n_cpus=2)
          rows=[]
          for combo,samps in groups.items():
              meta=pd.DataFrame(index=samps)
              meta['condition']=pd.Categorical(['control' if 'Ctrl' in s else 'water_deficit' for s in samps],categories=['control','water_deficit'])
              z=xf[samps].T
              # DESeq2 cannot accept genes all-zero in this subset; remove only those after the paper-level global filter.
              z=z.loc[:,z.sum(axis=0)>0]
              dds=DeseqDataSet(counts=z,metadata=meta,design='~condition',refit_cooks=True,inference=inf,quiet=True)
              dds.deseq2()
              ds=DeseqStats(dds,contrast=['condition','water_deficit','control'],alpha=0.05,cooks_filter=True,independent_filter=True,inference=inf,quiet=True)
              ds.summary(); res=ds.results_df
              for gid in targets:
                  r=res.loc[gid]
                  rows.append({'combo':combo,'gene_id':gid,'global_genes':int(xf.shape[0]),'subset_genes':int(z.shape[1]),'lfc':float(r.log2FoldChange),'lfcSE':float(r.lfcSE),'pvalue':float(r.pvalue) if pd.notna(r.pvalue) else None,'padj':float(r.padj) if pd.notna(r.padj) else None})
          o=pd.DataFrame(rows)
          o.to_csv('global_filter_results.csv',index=False)
          print(o.to_string(index=False))
      - uses: actions/upload-artifact@v4
        with:
          name: GSE255759_global_filter_check
          path: global_filter_results.csv
          retention-days: 30
