rubric_version: "1.0.0"
date_created: "2026-09-05"
description: "Objective evaluation rubric for Plain Gemini 3.8 Flash High vs. Gemini 3.8 Flash High + AREIL"

dimensions:
  - id: D01
    name: "Research Decomposition"
    description: "Was the core scientific problem decomposed into explicit, falsifiable, atomic claims rather than broad narrative assertions?"
    type: "rating"
    scale: "1-5"
    weight: 1.0

  - id: D02
    name: "Search Breadth & Route Independence"
    description: "Were multiple distinct bibliographic and biological databases consulted (e.g. PubMed, Europe PMC, Crossref, local primary texts)?"
    type: "count_and_rating"
    scale: "1-5"
    weight: 1.0

  - id: D03
    name: "Primary Source Authority & Retrieval"
    description: "Were primary experimental research papers retrieved and inspected, rather than relying on review abstracts or snippet recall?"
    type: "percentage"
    weight: 1.2

  - id: D04
    name: "Citation Existence & Identity"
    description: "Do all cited literature references exist with verifiable DOIs, accurate authors, titles, and publication years?"
    type: "deterministic_count"
    penalty_per_hallucination: -10.0
    weight: 1.5

  - id: D05
    name: "Citation Support Fidelity"
    description: "Do the cited publications actually support the exact assertions made in the text, verified against specific page/figure locations?"
    type: "percentage"
    weight: 1.5

  - id: D06
    name: "Contradiction & Null-Result Coverage"
    description: "Was disconfirming evidence, alternative mechanisms, failed replications, or opposing experimental findings explicitly sought and reported?"
    type: "count_and_rating"
    scale: "1-5"
    weight: 1.2

  - id: D07
    name: "Novelty Calibration"
    description: "Is novelty bounded by search coverage rather than claiming absolute absence of prior art ('never before shown')?"
    type: "rating"
    scale: "1-5"
    weight: 1.0

  - id: D08
    name: "Causal Inference Calibration"
    description: "Are causal claims appropriately tempered to experimental designs (correlation vs. genetic rescue vs. direct biochemical binding)?"
    type: "rating"
    scale: "1-5"
    weight: 1.2

  - id: D09
    name: "Statistical Correctness & Executability"
    description: "Are quantitative values, effect sizes, standard errors, and confidence intervals derived from executed code rather than mental arithmetic?"
    type: "deterministic_check"
    weight: 1.5

  - id: D10
    name: "Internal Consistency"
    description: "Do claims, numerical values, genotypes, concentrations, and cited results remain completely consistent across all sections?"
    type: "defect_count"
    weight: 1.0

  - id: D11
    name: "Reproducibility"
    description: "Can a fresh session reconstruct the exact evidence, reasoning, data, and manuscript state without conversational memory?"
    type: "binary_pass_fail"
    weight: 1.2

  - id: D12
    name: "Adversarial Resilience"
    description: "How many fatal or major methodological/scientific defects survive independent hostile peer review?"
    type: "defect_count"
    weight: 1.5

cost_metrics:
  - id: C01
    name: "Subagent / Worker Count"
  - id: C02
    name: "Search & Tool Calls"
  - id: C03
    name: "Sources Retrieved vs Used"
  - id: C04
    name: "Contradiction Searches Executed"
  - id: C05
    name: "Wall-Clock Execution Time (Seconds)"
  - id: C06
    name: "Coordination & Verification Overhead"
